name: Send Notification

on:
  workflow_dispatch: # मैन्युअल रन करने के लिए
  schedule:
    - cron: '30 0 * * *' # रोजाना सुबह 6:00 AM IST

jobs:
  execute-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Download Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Playwright & Headless Browser
        run: |
          pip install playwright
          playwright install chromium

      - name: 4. Run Diagnostic Bot
        run: python bot.py

      # अगर कोई भी एरर आता है, तो यह स्टेप ऑटोमैटिक स्क्रीनशॉट अपलोड कर देगा
      - name: 5. Upload Error Screenshot if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: error_screenshot.png
